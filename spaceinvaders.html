<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPACE INVADERS</title>
<style>
  html,body{
    margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Courier New",monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  #wrap{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#0a0a0a 0%,#000 70%);
  }
  canvas{
    image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 40px rgba(0,255,90,0.10),0 0 4px rgba(0,255,90,0.2);
    background:#000;display:block;
  }
  /* faint scanline overlay for CRT feel */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;opacity:.5;}
  #hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;color:#2a2;font-size:11px;
    letter-spacing:1px;z-index:6;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="scan"></div>
<div id="hint">← →  MOVE&nbsp;&nbsp;·&nbsp;&nbsp;SPACE  FIRE&nbsp;&nbsp;·&nbsp;&nbsp;P  PAUSE&nbsp;&nbsp;·&nbsp;&nbsp;M  MUTE</div>
<script>
"use strict";
/* =========================================================================
   SPACE INVADERS  —  single-file faithful arcade clone
   Original: Taito 1978 (Tomohiro Nishikado). Recreated mechanics:
   - 55 invaders (5x11), 3 types w/ 2-frame animation
   - fleet accelerates as it is depleted, drops+reverses at the walls
   - 4-note marching beat that speeds up with the fleet
   - single on-screen player shot, destructible bunkers (pixel erosion)
   - mystery UFO w/ authentic shot-count score table
   - lives, hi-score (localStorage), level progression
   ========================================================================= */

const GW = 224, GH = 256;                 // logical arcade resolution (portrait)
const buffer = document.createElement('canvas');
buffer.width = GW; buffer.height = GH;
const bx = buffer.getContext('2d');
const cv = document.getElementById('game');
const cx = cv.getContext('2d');

/* ---- responsive integer-ish scaling, crisp pixels ---- */
let SCALE = 3;
function resize(){
  const pad = 8;
  const availW = window.innerWidth  - pad;
  const availH = window.innerHeight - pad;
  const s = Math.max(1, Math.min(availW/GW, availH/GH));
  SCALE = s;
  cv.width  = Math.round(GW*SCALE);
  cv.height = Math.round(GH*SCALE);
  cx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* =========================== sprites ====================================
   1 = lit pixel. Stored as strings, parsed once into [{x,y}] lists +
   width/height so collision uses tight bounding boxes.                    */
function S(rows){
  const w = Math.max(...rows.map(r=>r.length)), h = rows.length;
  const px=[];
  for(let y=0;y<h;y++) for(let x=0;x<rows[y].length;x++)
    if(rows[y][x]==='1') px.push(x+ ',' + y);
  return {w,h,px,rows};
}
const SPR = {
  // type 0 = squid (30), type 1 = crab (20), type 2 = octopus (10)
  squid:[S([
    "00011000","00111100","01111110","11011011",
    "11111111","00100100","01011010","10100101"]),
        S([
    "00011000","00111100","01111110","11011011",
    "11111111","01000010","10000001","01000010"])],
  crab:[S([
    "00100000100","00010001000","00111111100","01101110110",
    "11111111111","10111111101","10100000101","00011011000"]),
       S([
    "00100000100","10010001001","10111111101","11101110111",
    "11111111111","00111111100","00100000100","01000000010"])],
  octopus:[S([
    "000011110000","011111111110","111111111111","111001100111",
    "111111111111","000110011000","011001100110","110000000011"]),
          S([
    "000011110000","011111111110","111111111111","111001100111",
    "111111111111","001111111100","110110011011","000110011000"])],
  player:S([
    "0000001000000","0000011100000","0000011100000","0111111111110",
    "1111111111111","1111111111111","1111111111111","1111111111111"]),
  ufo:S([
    "0000011111100000","0011111111111100","0111111111111110",
    "1101101101101101","1111111111111111","0011100110011100",
    "0001000000001000"]),
  // alien death burst
  boom:S([
    "00100000100","01001000010","00100100100","00011011000",
    "11100000111","00011011000","00100100100","01001000010","00100000100"]),
  // player explosion (2 frames)
  pboom:[S([
    "1000100010001","0100010001000","0010101010100","0001010101000",
    "0010111110100","0101111111010","0010111110100","0001010101000"]),
        S([
    "0010001000100","1000101010001","0010001000100","0101010101010",
    "0010111110100","1101111111011","0010101010100","0100010001000"])],
  // 3 bomb styles, 4 anim frames each (3x7)
};
// invader bombs (animated): rolling, plunger, squiggly
const BOMBS = {
  rolling:[S(["010","101","010","101","010","101","010"]),
           S(["010","011","010","110","010","011","010"])],
  plunger:[S(["010","010","010","010","010","010","010"]),
           S(["010","010","111","010","010","111","010"])],
  squiggly:[S(["010","001","010","100","010","001","010"]),
            S(["010","100","010","001","010","100","010"])],
};
const BOMB_TYPES = ['rolling','plunger','squiggly'];

/* bunker shape: classic arched fort, 1px grid; mutable per-instance */
const BUNKER_ROWS = [
  "0011111111111100",
  "0111111111111110",
  "1111111111111111",
  "1111111111111111",
  "1111111111111111",
  "1111111111111111",
  "1111110000111111",
  "1111100000011111",
  "1111000000001111",
  "1111000000001111",
];
const BUNKER_W = BUNKER_ROWS[0].length, BUNKER_H = BUNKER_ROWS.length;

/* ============================ audio ====================================
   Web Audio, all synthesized — no external files.                        */
const AudioFX = (()=>{
  let ac=null, master=null, muted=false;
  function ensure(){
    if(ac) return;
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);
    }catch(e){ ac=null; }
  }
  function resume(){ if(ac && ac.state==='suspended') ac.resume(); }
  function blip(freq,dur,type,vol,slideTo){
    if(!ac||muted) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), ac.currentTime+dur);
    g.gain.value=vol||0.3;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur);
  }
  function noise(dur,vol,filterFreq){
    if(!ac||muted) return;
    const n=Math.floor(ac.sampleRate*dur);
    const b=ac.createBuffer(1,n,ac.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(); src.buffer=b;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq||1200;
    const g=ac.createGain(); g.gain.value=vol||0.4;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  // 4 descending marching notes
  const marchNotes=[
    ()=>blip(110,0.12,'square',0.32,90),
    ()=>blip(98 ,0.12,'square',0.32,80),
    ()=>blip(87 ,0.12,'square',0.32,72),
    ()=>blip(78 ,0.12,'square',0.32,64),
  ];
  let marchIdx=0;
  // UFO continuous warble
  let ufoOsc=null, ufoGain=null, ufoLfo=null;
  function ufoStart(){
    if(!ac||muted||ufoOsc) return;
    ufoOsc=ac.createOscillator(); ufoGain=ac.createGain();
    ufoLfo=ac.createOscillator(); const lg=ac.createGain();
    ufoOsc.type='sawtooth'; ufoOsc.frequency.value=520;
    ufoLfo.frequency.value=11; lg.gain.value=120;
    ufoLfo.connect(lg); lg.connect(ufoOsc.frequency);
    ufoGain.gain.value=0.12;
    ufoOsc.connect(ufoGain); ufoGain.connect(master);
    ufoOsc.start(); ufoLfo.start();
  }
  function ufoStop(){
    if(ufoOsc){ try{ufoOsc.stop();ufoLfo.stop();}catch(e){} ufoOsc=null;ufoLfo=null;ufoGain=null; }
  }
  return {
    ensure, resume,
    setMuted(m){ muted=m; if(m) ufoStop(); },
    isMuted(){ return muted; },
    shoot(){ blip(880,0.12,'square',0.25,180); },
    march(){ if(muted)return; marchNotes[marchIdx%4](); marchIdx++; },
    resetMarch(){ marchIdx=0; },
    invaderDie(){ noise(0.22,0.5,1800); blip(160,0.18,'square',0.22,60); },
    playerDie(){ noise(0.6,0.6,800); blip(120,0.6,'sawtooth',0.3,40); },
    ufoStart, ufoStop,
    ufoDie(){ ufoStop(); noise(0.4,0.55,2400); blip(700,0.3,'square',0.3,120); },
    bunkerHit(){ blip(200,0.05,'square',0.12,140); },
    extraLife(){ blip(660,0.1,'square',0.3); setTimeout(()=>blip(880,0.15,'square',0.3),110); },
  };
})();

/* ============================ input ==================================== */
const keys={};
const Input={ left:false,right:false,fire:false,firePressed:false };
function setKey(e,down){
  const k=e.key.toLowerCase();
  let used=true;
  if(k==='arrowleft'||k==='a') Input.left=down;
  else if(k==='arrowright'||k==='d') Input.right=down;
  else if(k===' '||k==='arrowup'||k==='w'){ if(down&&!Input.fire) Input.firePressed=true; Input.fire=down; }
  else if(down&&(k==='enter')) Game.action();
  else if(down&&k==='p') Game.togglePause();
  else if(down&&k==='m'){ const m=!AudioFX.isMuted(); AudioFX.setMuted(m); }
  else used=false;
  if(used){ AudioFX.ensure(); AudioFX.resume(); e.preventDefault(); }
}
window.addEventListener('keydown',e=>setKey(e,true));
window.addEventListener('keyup',e=>setKey(e,false));

/* touch / pointer controls — left half move, right half fire; drag to steer */
let touchSteer=null;
function pointerPos(e){
  const r=cv.getBoundingClientRect();
  const cxx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return cxx/r.width; // 0..1
}
cv.addEventListener('pointerdown',e=>{
  AudioFX.ensure(); AudioFX.resume();
  if(Game.state!=='play'){ Game.action(); return; }
  const fr=pointerPos(e);
  if(fr>0.62){ if(!Input.fire) Input.firePressed=true; Input.fire=true; }
  else { touchSteer=fr; }
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{ if(touchSteer!==null){ touchSteer=pointerPos(e); } });
window.addEventListener('pointerup',e=>{ touchSteer=null; Input.fire=false; });

/* ============================ drawing helpers ========================== */
function drawSprite(spr,px,py,color){
  bx.fillStyle=color;
  const rows=spr.rows;
  for(let y=0;y<rows.length;y++){
    const row=rows[y];
    for(let x=0;x<row.length;x++) if(row[x]==='1') bx.fillRect(px+x,py+y,1,1);
  }
}
/* pixel-perfect text using built-in font; buffer is scaled => crisp retro */
function text(str,x,y,color,size,align){
  bx.fillStyle=color||'#fff';
  bx.font='bold '+(size||8)+'px "Courier New",monospace';
  bx.textAlign=align||'left'; bx.textBaseline='top';
  bx.fillText(str,x,y);
}

/* ============================ game state =============================== */
const HI_KEY='si_hiscore_v1';
const Game = {
  state:'title',           // title | play | dying | clear | over | paused
  score:0, hi:parseInt(localStorage.getItem(HI_KEY)||'0',10)||0,
  lives:3, level:1, credit:0,
  shotCount:0,             // total player shots (for UFO score table)
  bonusGiven:false,
  prevState:'play',
};

/* fleet */
const Fleet = {
  cols:11, rows:5,
  ax:0, ay:0,             // formation top-left in game px
  dir:1,                  // 1 right, -1 left
  dropPending:false,
  alive:[],               // [row][col] bool
  aliveCount:55,
  stepTimer:0, stepInterval:600,
  frame:0,                // animation frame 0/1
  gx:16,                  // horizontal grid spacing
  gy:16,                  // vertical grid spacing
};
const CELLW=16, CELLH=16;            // grid cell
const ALIEN_OFFX=[4,2,2];            // center sprite in cell by type (squid/crab/oct)
function alienType(row){ return row===0?0 : row<3?1:2; } // top=squid,next2=crab,bottom2=octopus
const TYPE_SPR=['squid','crab','octopus'];
const TYPE_SCORE=[30,20,10];

/* entities */
let playerX=GW/2-6, playerY=GH-40;
const PLAYER_W=SPR.player.w, PLAYER_H=SPR.player.h;
let bullet=null;          // {x,y}
let bombs=[];             // {x,y,type,frame,ft}
let bunkers=[];           // {x,y,grid:Uint8Array}
let ufo=null;             // {x,dir,timer}
let ufoTimer=0;
let explosions=[];        // {x,y,t,spr,color,score?}
let playerExplode=0;      // frames remaining
let dyingTimer=0, clearTimer=0, flash=0;
let bombTimer=0;

const GROUND_Y=GH-22;     // green ground line
const PLAYER_TOP=GH-40;

/* ---- setup helpers ---- */
function startGame(){
  Game.score=0; Game.lives=3; Game.level=1; Game.shotCount=0; Game.bonusGiven=false;
  AudioFX.resetMarch();
  newLevel(true);
  Game.state='play';
}
function newLevel(first){
  Fleet.aliveCount=55; Fleet.dir=1; Fleet.frame=0; Fleet.dropPending=false;
  Fleet.alive=[];
  for(let r=0;r<Fleet.rows;r++){ Fleet.alive[r]=[]; for(let c=0;c<Fleet.cols;c++) Fleet.alive[r][c]=true; }
  Fleet.ax=24;
  // each level the fleet starts lower (more dangerous), capped
  Fleet.ay=48 + Math.min(5,(Game.level-1))*8;
  Fleet.stepInterval=baseInterval();
  Fleet.stepTimer=0;
  bullet=null; bombs=[]; ufo=null; explosions=[]; playerExplode=0;
  playerX=GW/2-PLAYER_W/2;
  ufoTimer=ufoNextDelay();
  bombTimer=60;
  if(first) buildBunkers();
  else buildBunkers();   // fresh bunkers each level (arcade behaviour)
  clearTimer=0; dyingTimer=0;
}
function baseInterval(){
  // ms between fleet steps with full fleet; lower = faster. Speeds up per level.
  return Math.max(120, 560 - (Game.level-1)*55);
}
function buildBunkers(){
  bunkers=[];
  const n=4, totalW=n*BUNKER_W, gaps=(GW-totalW)/(n+1);
  for(let i=0;i<n;i++){
    const bxp=Math.round(gaps*(i+1)+BUNKER_W*i);
    const grid=new Uint8Array(BUNKER_W*BUNKER_H);
    for(let y=0;y<BUNKER_H;y++) for(let x=0;x<BUNKER_W;x++)
      grid[y*BUNKER_W+x]= BUNKER_ROWS[y][x]==='1'?1:0;
    bunkers.push({x:bxp,y:GROUND_Y-34,grid});
  }
}
function ufoNextDelay(){ return 1200 + Math.floor(Math.random()*900); } // frames (~20-35s @60)

/* ---- fleet geometry ---- */
function alienX(c){ return Fleet.ax + c*CELLW; }
function alienY(r){ return Fleet.ay + r*CELLH; }
function alienBox(r,c){
  const t=alienType(r), spr=SPR[TYPE_SPR[t]][Fleet.frame];
  const ox=ALIEN_OFFX[t];
  return {x:alienX(c)+ox, y:alienY(r)+ (8-spr.h)+2, w:spr.w, h:spr.h, spr};
}
function liveColRange(){
  let minC=99,maxC=-1,maxR=-1;
  for(let r=0;r<Fleet.rows;r++)for(let c=0;c<Fleet.cols;c++) if(Fleet.alive[r][c]){
    if(c<minC)minC=c; if(c>maxC)maxC=c; if(r>maxR)maxR=r;
  }
  return {minC,maxC,maxR};
}

/* ============================ update =================================== */
let lastT=0;
function frame(t){
  const dt=Math.min(50, t-lastT||16); lastT=t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function update(dt){
  if(flash>0) flash-=dt;
  if(Game.state==='play'){ updatePlay(dt); }
  else if(Game.state==='dying'){
    dyingTimer-=dt; playerExplode-=dt;
    updateExplosions(dt);
    if(dyingTimer<=0){
      if(Game.lives<=0){ gameOver(); }
      else { respawn(); Game.state='play'; }
    }
  } else if(Game.state==='clear'){
    clearTimer-=dt; updateExplosions(dt);
    if(clearTimer<=0){ Game.level++; newLevel(false); Game.state='play'; }
  }
}

function updatePlay(dt){
  // ----- player movement -----
  const speed=1.4*dt/16.67;
  if(touchSteer!==null){
    const target=touchSteer*GW - PLAYER_W/2;
    playerX += Math.max(-speed*1.6,Math.min(speed*1.6,target-playerX));
  } else {
    if(Input.left)  playerX-=speed;
    if(Input.right) playerX+=speed;
  }
  playerX=Math.max(8,Math.min(GW-8-PLAYER_W,playerX));

  // ----- player fire (single shot on screen) -----
  if(Input.firePressed){ Input.firePressed=false; if(!bullet){
    bullet={x:Math.round(playerX+PLAYER_W/2), y:playerY-4};
    Game.shotCount++; AudioFX.shoot();
  }}

  // ----- player bullet -----
  if(bullet){
    bullet.y-=4.2*dt/16.67;
    if(bullet.y<24){ bullet=null; }
    else {
      if(bullet && hitBunkers(bullet.x,bullet.y,true)){ bullet=null; }
      if(bullet && ufo && bullet.y<46 && bullet.x>=ufo.x && bullet.x<=ufo.x+SPR.ufo.w && bullet.y<=44+SPR.ufo.h){
        killUfo(); bullet=null;
      }
      if(bullet) checkBulletAliens();
    }
  }

  // ----- fleet stepping (acceleration via interval ∝ aliveCount) -----
  Fleet.stepTimer+=dt;
  // interval scales with remaining aliens (fewer => faster); marching beat matches
  Fleet.stepInterval = Math.max(60, baseInterval()*(0.18+0.82*Fleet.aliveCount/55));
  if(Fleet.stepTimer>=Fleet.stepInterval){
    Fleet.stepTimer-=Fleet.stepInterval;
    stepFleet();
    AudioFX.march();
  }

  // ----- alien bombs -----
  bombTimer-=dt;
  const maxBombs = 2 + Math.min(3,Game.level);
  if(bombTimer<=0 && bombs.length<maxBombs && Fleet.aliveCount>0){
    dropBomb();
    bombTimer = (260 - Math.min(160,Game.level*22)) * (0.5+Math.random());
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    if(!b) continue;
    b.y+=1.6*dt/16.67; b.ft+=dt;
    if(b.ft>90){ b.ft=0; b.frame^=1; }
    if(b.y>GH-14){ bombs.splice(i,1); continue; }
    if(hitBunkers(b.x,b.y,false)){ bombs.splice(i,1); continue; }
    // hit player? (playerHit() clears the bombs array — bail out of the loop)
    if(playerExplode<=0 && b.y>=playerY && b.x>=playerX && b.x<=playerX+PLAYER_W){
      bombs.splice(i,1); playerHit(); break;
    }
    // bomb vs bullet
    if(bullet && Math.abs(b.x-bullet.x)<3 && Math.abs(b.y-bullet.y)<6){
      bombs.splice(i,1); if(Math.random()<0.6) bullet=null;
    }
  }
  // a hit may have switched us out of 'play' mid-frame
  if(Game.state!=='play') return;

  // ----- UFO -----
  ufoTimer-=dt/16.67;
  if(!ufo && ufoTimer<=0 && Fleet.aliveCount>3){
    const dir=Math.random()<0.5?1:-1;
    ufo={x: dir>0? -SPR.ufo.w : GW, dir, hit:false};
    AudioFX.ufoStart();
  }
  if(ufo){
    ufo.x += ufo.dir*0.9*dt/16.67;
    if(ufo.x>GW || ufo.x<-SPR.ufo.w){ ufo=null; AudioFX.ufoStop(); ufoTimer=ufoNextDelay(); }
  }

  updateExplosions(dt);

  // ----- lose conditions -----
  const {maxR}=liveColRange();
  if(maxR>=0){
    const lowestY=alienY(maxR)+8;
    if(lowestY>=playerY+2){ // invasion reached the cannon line
      flash=200; playerHit(true);
    }
  }

  // ----- win condition -----
  if(Fleet.aliveCount===0){
    Game.state='clear'; clearTimer=1400; flash=120;
    AudioFX.ufoStop();
  }

  // bonus life
  if(!Game.bonusGiven && Game.score>=1500){ Game.bonusGiven=true; Game.lives++; AudioFX.extraLife(); }
  if(Game.score>Game.hi){ Game.hi=Game.score; }
}

function stepFleet(){
  Fleet.frame^=1;
  const {minC,maxC}=liveColRange();
  if(minC>maxC) return;
  const leftEdge=alienX(minC)+ALIEN_OFFX[0];
  const rightEdge=alienX(maxC)+CELLW-2;
  if(Fleet.dropPending){
    Fleet.ay+=8; Fleet.dir*=-1; Fleet.dropPending=false;
  } else {
    const nextL=leftEdge+Fleet.dir*2;
    const nextR=rightEdge+Fleet.dir*2;
    if(nextL<=8 || nextR>=GW-8){ Fleet.ax+=Fleet.dir*2; Fleet.dropPending=true; }
    else { Fleet.ax+=Fleet.dir*2; }
  }
}

function checkBulletAliens(){
  if(!bullet) return;
  for(let r=Fleet.rows-1;r>=0;r--){           // check from bottom up
    for(let c=0;c<Fleet.cols;c++){
      if(!Fleet.alive[r][c]) continue;
      const b=alienBox(r,c);
      if(bullet.x>=b.x-1 && bullet.x<=b.x+b.w+1 && bullet.y>=b.y-1 && bullet.y<=b.y+b.h+1){
        Fleet.alive[r][c]=false; Fleet.aliveCount--;
        const sc=TYPE_SCORE[alienType(r)];
        addScore(sc);
        explosions.push({x:b.x-1,y:b.y-1,t:180,spr:SPR.boom,color:'#fff'});
        AudioFX.invaderDie();
        bullet=null;
        return;
      }
    }
  }
}

function dropBomb(){
  // pick a random column that has a live alien, fire from its lowest alien
  const cols=[];
  for(let c=0;c<Fleet.cols;c++){
    for(let r=Fleet.rows-1;r>=0;r--){ if(Fleet.alive[r][c]){ cols.push([c,r]); break; } }
  }
  if(!cols.length) return;
  const [c,r]=cols[Math.floor(Math.random()*cols.length)];
  const b=alienBox(r,c);
  const type=BOMB_TYPES[Math.floor(Math.random()*3)];
  bombs.push({x:Math.round(b.x+b.w/2),y:b.y+b.h,type,frame:0,ft:0});
}

/* UFO scoring uses the authentic shot-count table (every 15 shots; 23rd=300) */
const UFO_TABLE=[100,50,50,100,150,100,100,50,300,100,100,100,50,150,100];
function killUfo(){
  const val=UFO_TABLE[(Game.shotCount-1+15)%15];
  addScore(val);
  explosions.push({x:ufo.x,y:42,t:600,spr:null,color:'#f33',score:val});
  AudioFX.ufoDie();
  ufo=null; ufoTimer=ufoNextDelay();
}

function addScore(n){ Game.score+=n; if(Game.score>Game.hi) Game.hi=Game.score; }

/* bunker collision + erosion. returns true if (x,y) hit solid bunker pixel */
function hitBunkers(x,y,fromPlayer){
  for(const bk of bunkers){
    const lx=Math.floor(x-bk.x), ly=Math.floor(y-bk.y);
    if(lx<0||ly<0||lx>=BUNKER_W||ly>=BUNKER_H) continue;
    if(bk.grid[ly*BUNKER_W+lx]){
      erode(bk,lx,ly,fromPlayer);
      AudioFX.bunkerHit();
      return true;
    }
  }
  return false;
}
function erode(bk,cx2,cy,fromPlayer){
  // carve a small blast crater; player shots dig up, bombs dig down/wider
  const r=fromPlayer?2:2.4;
  for(let yy=-Math.ceil(r);yy<=Math.ceil(r);yy++){
    for(let xx=-Math.ceil(r);xx<=Math.ceil(r);xx++){
      if(xx*xx+yy*yy> r*r+0.5) continue;
      const px=cx2+xx, py=cy+yy;
      if(px<0||py<0||px>=BUNKER_W||py>=BUNKER_H) continue;
      // jagged edges: randomly skip outer ring
      if(xx*xx+yy*yy>r*r-1 && Math.random()<0.4) continue;
      bk.grid[py*BUNKER_W+px]=0;
    }
  }
}

function playerHit(invasion){
  if(playerExplode>0) return;
  Game.lives--;
  playerExplode=900; flash=Math.max(flash,120);
  AudioFX.playerDie(); AudioFX.ufoStop();
  bombs=[]; ufo=null;
  explosions.push({x:playerX,y:playerY,t:900,spr:SPR.pboom[0],color:'#2f6',player:true});
  Game.state='dying'; dyingTimer=invasion?1300:1100;
  if(invasion){ // push fleet back up a touch so respawn isn't instant death
    Fleet.ay=Math.max(Fleet.ay-16,48);
  }
}
function respawn(){
  playerX=GW/2-PLAYER_W/2; playerExplode=0; bullet=null;
}
function gameOver(){
  Game.state='over'; AudioFX.ufoStop();
  if(Game.score>=Game.hi){ Game.hi=Game.score; }
  localStorage.setItem(HI_KEY, String(Math.max(Game.hi,Game.score)));
}

function updateExplosions(dt){
  for(let i=explosions.length-1;i>=0;i--){
    const e=explosions[i]; e.t-=dt;
    if(e.player){ e.spr = SPR.pboom[(Math.floor(e.t/90)%2)]; }
    if(e.t<=0) explosions.splice(i,1);
  }
}

/* ============================ render =================================== */
function render(){
  bx.fillStyle = flash>0 ? '#102' : '#000';
  bx.fillRect(0,0,GW,GH);

  drawHUD();

  if(Game.state==='title'){ drawTitle(); blit(); return; }
  if(Game.state==='over'){ drawField(); drawGameOver(); blit(); return; }

  drawField();

  if(Game.state==='paused'){
    text('PAUSE',GW/2,GH/2-4,'#fff',12,'center');
    blit(); return;
  }
  blit();
}

function drawHUD(){
  text('SCORE<1>',8,4,'#0f0',8);
  text('HI-SCORE',GW-8,4,'#0f0',8,'right');
  text(pad(Game.score,5),12,14,'#fff',8);
  text(pad(Game.hi,5),GW-12,14,'#fff',8,'right');
}
function pad(n,w){ let s=''+n; while(s.length<w) s='0'+s; return s; }

function drawField(){
  // green ground line
  bx.fillStyle='#0f0'; bx.fillRect(8,GROUND_Y,GW-16,1);

  // bunkers
  for(const bk of bunkers){
    bx.fillStyle='#1eff5a';
    for(let y=0;y<BUNKER_H;y++)for(let x=0;x<BUNKER_W;x++)
      if(bk.grid[y*BUNKER_W+x]) bx.fillRect(bk.x+x,bk.y+y,1,1);
  }

  // aliens
  for(let r=0;r<Fleet.rows;r++)for(let c=0;c<Fleet.cols;c++){
    if(!Fleet.alive[r][c]) continue;
    const t=alienType(r), spr=SPR[TYPE_SPR[t]][Fleet.frame];
    const ox=ALIEN_OFFX[t];
    drawSprite(spr, alienX(c)+ox, alienY(r)+(8-spr.h)+2, '#fff');
  }

  // UFO
  if(ufo){ drawSprite(SPR.ufo, Math.round(ufo.x), 42, '#ff3b3b'); }

  // bombs
  for(const b of bombs){
    const spr=BOMBS[b.type][b.frame];
    drawSprite(spr, Math.round(b.x-1), Math.round(b.y), '#fff');
  }

  // player bullet
  if(bullet){ bx.fillStyle='#fff'; bx.fillRect(Math.round(bullet.x),Math.round(bullet.y),1,4); }

  // player
  if(Game.state!=='dying' || playerExplode<=0){
    if(Game.state==='play'||Game.state==='clear'||Game.state==='paused')
      drawSprite(SPR.player, Math.round(playerX), playerY, '#2effa0');
  }

  // explosions
  for(const e of explosions){
    if(e.score!==undefined){ text(''+e.score, e.x+SPR.ufo.w/2, 42, e.color, 8, 'center'); }
    else if(e.spr){ drawSprite(e.spr, Math.round(e.x), Math.round(e.y), e.color); }
  }

  // lives + credit row (below ground line)
  text(''+Game.lives, 8, GH-16, '#fff', 8);
  let lx=20;
  for(let i=0;i<Math.min(Game.lives-1,4);i++){ drawSprite(SPR.player, lx, GH-17, '#2effa0'); lx+=PLAYER_W+3; }
  text('LEVEL '+Game.level, GW/2, GH-16, '#0a0', 8, 'center');
  text('CREDIT '+pad(Game.credit,2), GW-8, GH-16, '#fff', 8, 'right');
}

let titleBlink=0;
function drawTitle(){
  titleBlink+=1;
  // logo
  text('SPACE',GW/2,46,'#1eff5a',20,'center');
  text('INVADERS',GW/2,70,'#1eff5a',20,'center');

  // score advance table
  text('*SCORE ADVANCE TABLE*',GW/2,100,'#fff',8,'center');
  const ix=GW/2-30, tx=ix+22;            // icon column / text column
  drawSprite(SPR.ufo,     ix-3, 114, '#ff3b3b'); text('= ? MYSTERY',tx,116,'#ff3b3b',8);
  drawSprite(SPR.squid[0],   ix, 128, '#fff');   text('= 30 PTS',  tx,128,'#fff',8);
  drawSprite(SPR.crab[0],  ix-1, 142, '#fff');   text('= 20 PTS',  tx,142,'#fff',8);
  drawSprite(SPR.octopus[0],ix-2,156, '#fff');   text('= 10 PTS',  tx,156,'#fff',8);

  if(Math.floor(titleBlink/30)%2===0)
    text('PRESS  SPACE  TO  START',GW/2,184,'#fff',8,'center');
  text('HI-SCORE  '+pad(Game.hi,5),GW/2,204,'#0f0',8,'center');
  text('< > MOVE   SPACE FIRE',GW/2,224,'#0a0',8,'center');
  text('TAITO 1978  RECREATION',GW/2,238,'#066',8,'center');
}

function drawGameOver(){
  bx.fillStyle='rgba(0,0,0,0.55)'; bx.fillRect(0,40,GW,GH-60);
  text('GAME OVER',GW/2,96,'#ff3b3b',16,'center');
  text('SCORE  '+pad(Game.score,5),GW/2,124,'#fff',8,'center');
  if(Game.score>=Game.hi) text('NEW HI-SCORE!',GW/2,138,'#0f0',8,'center');
  if(Math.floor(titleBlink++/30)%2===0)
    text('PRESS SPACE TO PLAY',GW/2,168,'#fff',8,'center');
}

function blit(){
  cx.imageSmoothingEnabled=false;
  cx.clearRect(0,0,cv.width,cv.height);
  cx.drawImage(buffer,0,0,cv.width,cv.height);
}

/* ============================ control flow ============================ */
Game.action=function(){
  AudioFX.ensure(); AudioFX.resume();
  if(Game.state==='title'||Game.state==='over'){ startGame(); }
};
Game.togglePause=function(){
  if(Game.state==='play'){ Game.prevState='play'; Game.state='paused'; AudioFX.ufoStop(); }
  else if(Game.state==='paused'){ Game.state='play'; }
};

requestAnimationFrame(frame);
</script>
